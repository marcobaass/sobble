<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobbly Sphere</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas class="webgl"></canvas>
    <div class="audio-player">
        <div class="controls-container">
            <button class="previous-track"><Previous>&#9198;</button>
            <button class="play-pause">&#9654;</button>
            <button class="stop">&#9632;</button>
            <button class="next-track">&#9197;</button>
        </div>
        <div class="progress-bar-container">
            <input class="progress-bar" type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="playlist-container">
            <ol class="playlist-list">
                <li class="playlist-item">
                    music.mp3
                </li>
            </ol>
        </div>
        <label class="track-upload-label">
            &#9650;
            <input class="track-upload" type="file" accept="audio/*">
        </label>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
