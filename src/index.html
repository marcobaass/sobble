<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobbly Sphere</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="loader">
        <img src="record.svg" alt="logo" width="250" height="250">
    </div>
    <canvas class="webgl"></canvas>
    <div class="audio-player">
        <div class="controls-container">
            <button class="previous-track"><Previous><p>&#9198;</p></button>
            <button class="play-pause"><p>&#9654;</p></button>
            <button class="stop"><p>&#9632;</p></button>
            <button class="next-track"><p>&#9197;</p></button>
        </div>
        <div class="progress-bar-container">
            <input class="progress-bar" type="range" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="playlist-container">
            <ol class="playlist-list">
                <li class="playlist-item">
                    <p>music.mp3</p>
                    <button class="delete-track">x</button>
                </li>
            </ol>
        </div>
        <label class="track-upload-label">
            <p>&#9650;</p>
            <input class="track-upload" type="file" accept="audio/*">
        </label>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
