<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobbly Sphere</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <canvas class="webgl"></canvas>
    <div class="audio-player">
        <button class="play-pause">Play</button>
        <input class="track-upload" type="file" accept="audio/*">
        <div class="playlist-container">
            <ol class="playlist-list">
                <li class="playlist-item">
                    music.mp3
                </li>
            </ol>
        </div>
        <button class="previous-track">Previous</button>
        <button class="next-track">Next</button>
        <input class="progress-bar" type="range" min="0" max="1" step="0.01" value="0">
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
